version: "1.0"
name: checkver-sweep
displayName: 自动检测上游版本并 bump scoop 清单
stages:
  - name: sweep
    displayName: checkver sweep
    strategy: naturally
    trigger: auto
    executor:
      - gitee
    steps:
      - step: custom-build@custom
        name: bump-manifests
        displayName: bump bucket manifests
        commands: |-
          source setup python 3.11
          python3 --version
          git config --get remote.origin.url
          # 写回走 git push：runner 的 workspace clone 自带本次构建的仓库凭据，
          # 不需要把任何 token 放进这份 YAML。push 被拒时脚本非 0 退出，构建直接红。
          python3 ci/checkver.py --commit
triggers:
  trigger: auto
  push:
    branches:
      precise:
        - master
    paths:
      include:
        - ci/checkver.py
        - ci/checkver.json
  schedule:
    # 每天 09:03（北京时间）；上游发新版后最迟次日清单就跟上
    - cron: 0 3 9 * * ?
strategy:
  retry: "1"
  timeout: 15
  cloneDepth: 1
