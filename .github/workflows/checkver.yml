name: checkver

# 每天 01:03 UTC（北京 09:03）检查上游 release，把 bucket 里的清单升到最新版并推回本仓。
# 写回用的是本次构建自带的 GITHUB_TOKEN（permissions: contents: write），
# 仓里和 secret 里没有任何长期凭据。
#
# 实测：GitHub Free 个人账户下这个仓库为 private 时 schedule 从不触发（5 个周期、含官方推荐
# 的错峰分钟 + disable/enable 重注册，全部 0 次），而 push 与 workflow_dispatch 都正常。
# 所以私有状态下自动通道只有本机一条命令：python3 ci/checkver.py --commit
on:
  schedule:
    - cron: "3 1 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - "ci/**"
      - "bucket/**"
      - ".github/workflows/checkver.yml"

permissions:
  contents: write

concurrency:
  group: checkver
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # detached HEAD at the triggered sha is fine: the script pushes
          # HEAD:refs/heads/$GITHUB_REF_NAME, and 1 commit is all it needs.
          fetch-depth: 1

      - name: Bump manifests from upstream releases
        run: python3 ci/checkver.py --commit
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
