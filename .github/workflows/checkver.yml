name: checkver

# 清单版本自动跟进。两种触发方式，分工不同：
#
# - push / workflow_dispatch：实测**可用**（本仓 11 次 push run + 6 次 dispatch run 全部 completed）。
#   手动兜底：pwsh -File ci/dispatch.ps1
# - schedule：实测在本账户**从不触发**。2026-10-19/20 覆盖私有与公开两种可见性、两个 workflow
#   （checkver 与独立的 schedule-only 探针）、错峰分钟（7,17,.../*/*）与整点（*/10）、
#   disable/enable 重注册，约 15 个预期窗口，event=schedule 的 run 数恒为 0。
#   保留这一段只是万一哪天生效；不要把它当依赖。
#
# 真正每天跑的是本机计划任务 scoop-bucket-checkver（每周/每天执行 ci/sweep.ps1：
# git pull → python3 ci/checkver.py --commit → push），日志在 %LOCALAPPDATA%\scoop-bucket-checkver.log。
# 写回只用本次构建自带的 GITHUB_TOKEN；仓里和 Actions secret 里没有任何长期凭据。
on:
  schedule:
    - cron: "3 1 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - "ci/**"
      - "bucket/**"
      - ".github/workflows/checkver.yml"

permissions:
  contents: write

concurrency:
  group: checkver
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # detached HEAD at the triggered sha is fine: the script pushes
          # HEAD:refs/heads/$GITHUB_REF_NAME, and 1 commit is all it needs.
          fetch-depth: 1

      - name: Bump manifests from upstream releases
        run: python3 ci/checkver.py --commit
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
