name: checkver

# 每天 01:03 UTC（北京 09:03）检查上游 release，把 bucket 清单升到最新并推回本仓。
# 写回只用本次构建自带的 GITHUB_TOKEN（permissions: contents: write）：仓里、Actions secret 里
# 都没有任何长期凭据（actions/secrets total_count = 0）。
#
# 私有仓 + GitHub Free 个人账户实测不触发 schedule：2026-10-19 用 "*/10"（撞整点）和
# "7,17,27,37,47,57"（官方建议的错峰分钟）两个探针、并 disable/enable 重注册后观察 5 个周期，
# event=schedule 的 run 数始终为 0，而同仓同配置的 push 与 workflow_dispatch 触发全部成功。
# 官方文档只写了「公开仓 60 天无活动会停 schedule」，没有写私有这条限制。
# 所以私有状态下要么手动一条命令（等价于流水线）：
#   python3 ci/checkver.py --commit
#   gh workflow run checkver.yml -R lsls01/scoop-bucket
# 要么把仓库转公开（gh repo edit lsls01/scoop-bucket --visibility public）让 cron 真正生效。
on:
  schedule:
    - cron: "3 1 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - "ci/**"
      - "bucket/**"
      - ".github/workflows/checkver.yml"

permissions:
  contents: write

concurrency:
  group: checkver
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # detached HEAD at the triggered sha is fine: the script pushes
          # HEAD:refs/heads/$GITHUB_REF_NAME, and 1 commit is all it needs.
          fetch-depth: 1

      - name: Bump manifests from upstream releases
        run: python3 ci/checkver.py --commit
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
